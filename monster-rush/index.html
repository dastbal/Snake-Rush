<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1430">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-180.png">
<title>Monster Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="consola">
    <div class="marco">
      <div class="pantalla">
        <div id="juego"></div>
        <div id="capa"></div>
      </div>
    </div>
    <p class="marca">MONSTER RUSH <span>COLOR</span></p>

    <!-- Mando: ver src/interfaz/mando.js -->
    <div class="cruceta" role="group" aria-label="Cruceta">
      <button type="button" class="dir d-arriba" data-boton="arriba" aria-label="Arriba">▲</button>
      <button type="button" class="dir d-izquierda" data-boton="izquierda" aria-label="Izquierda">◀</button>
      <span class="d-centro" aria-hidden="true"></span>
      <button type="button" class="dir d-derecha" data-boton="derecha" aria-label="Derecha">▶</button>
      <button type="button" class="dir d-abajo" data-boton="abajo" aria-label="Abajo">▼</button>
    </div>
    <div class="ab" role="group" aria-label="Botones A y B">
      <button type="button" class="redondo boton-b" data-boton="B" aria-label="B: volver">B</button>
      <button type="button" class="redondo boton-a" data-boton="A" aria-label="A: hablar o elegir">A</button>
    </div>
    <div class="centrales">
      <a class="pastilla" href="../">ARCADE</a>
      <button type="button" class="pastilla" id="boton-sonido" aria-label="Sonido" aria-pressed="false">🔊</button>
      <button type="button" class="pastilla" data-boton="START" aria-label="Start: menú">START</button>
    </div>
  </main>
  <p class="creditos">Autor: David Balladares · Coautor: Leandro Rodríguez</p>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
