<title>Snake Rush</title>
<style>
  /* Máquina arcade: pantalla de juego + panel de botones; lado a lado en horizontal */
  :root {
    --bg: #0d1210;
    --panel: #161e1a;
    --line: #2a3a31;
    --fg: #c8e6cf;
    --muted: #7d9a86;
    --acento: #ffd83a;
    --rojo: #e0312b;
    --font: "Courier New", ui-monospace, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-inline: 16px; padding-block: 12px; box-sizing: border-box; gap: 10px;
  }
  .maquina { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; align-items: center; width: 100%; }
  .columna { display: flex; flex-direction: column; gap: 8px; width: min(100%, 520px, calc(100vh - 380px)); min-width: 260px; }
  @media (orientation: landscape) and (min-width: 700px) {
    .columna { width: min(520px, calc(100vh - 90px)); }
  }

  /* Barra de arriba: pausa y sonido */
  .barra { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .barra .derecha { display: flex; gap: 8px; }
  .aviso {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5;
    background: var(--panel); border: 2px solid var(--acento); border-radius: 8px; padding: 8px 12px;
    font-size: 13px; width: max-content; max-width: 90%; text-align: center;
  }
  button {
    font: inherit; font-size: 15px; color: var(--fg); background: var(--panel);
    border: 2px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; min-height: 40px;
    touch-action: manipulation;
  }
  button[aria-pressed="true"] { border-color: var(--fg); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: default; }

  /* La pantalla: el canvas y los carteles encima */
  .pantalla { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border: 3px solid #000; border-radius: 4px; overflow: hidden; touch-action: none; }
  #juego, #juego canvas { width: 100% !important; height: 100% !important; display: block; }
  .cartel {
    position: absolute; inset: 0; background: rgba(5, 8, 7, 0.9); overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; box-sizing: border-box; text-align: center;
  }
  .cartel h1 { margin: 0; font-size: clamp(30px, 9vw, 48px); letter-spacing: 0.12em; color: var(--acento); text-shadow: 3px 3px 0 var(--rojo); }
  .cartel h2 { margin: 0; font-size: 26px; color: var(--rojo); letter-spacing: 0.1em; }
  .grupo { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .etiqueta { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .fila { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .color { width: 38px; min-height: 38px; padding: 0; }
  .grande {
    font-size: 20px; font-weight: bold; padding: 10px 28px; color: #2a1a00; letter-spacing: 0.1em;
    background: var(--acento); border-color: #000; box-shadow: 0 5px 0 #a8860f;
  }
  .grande:active { transform: translateY(4px); box-shadow: 0 1px 0 #a8860f; }
  .tabla { margin: 0; padding: 0; list-style: none; font-variant-numeric: tabular-nums; min-width: 200px; }
  .tabla li { display: flex; justify-content: space-between; gap: 16px; padding: 2px 0; border-bottom: 1px dashed var(--line); }
  .tabla .vacia { color: var(--muted); justify-content: center; }
  #iniciales { font: inherit; font-size: 22px; width: 5ch; text-align: center; text-transform: uppercase; background: var(--panel); color: var(--fg); border: 2px solid var(--acento); border-radius: 6px; padding: 4px; }
  .nota { margin: 0; color: var(--muted); font-size: 13px; max-width: 32ch; }

  /* Panel de máquina arcade: base de metal con botones redondos de plástico */
  .flechas {
    --boton: #e0312b; --boton-luz: #ff7a6b; --boton-sombra: #8a1410; --placa: #1b1b1f; --tornillo: #55555c;
    display: grid; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(3, 72px);
    gap: 4px; justify-content: center; align-content: center;
    padding: 14px; border-radius: 18px; position: relative;
    background: linear-gradient(160deg, #2c2c33, var(--placa));
    border: 3px solid #3a3a42; box-shadow: inset 0 2px 0 #4a4a52, 0 6px 0 #0a0a0c;
  }
  .flechas::before {
    content: ""; position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: var(--tornillo); top: 10px; left: 10px; box-shadow: 232px 0 0 var(--tornillo), 0 232px 0 var(--tornillo), 232px 232px 0 var(--tornillo);
  }
  .flechas button {
    width: 64px; height: 64px; min-height: 0; margin: auto; padding: 0; border-radius: 50%;
    border: 3px solid #111; color: #fff6e8; font-size: 22px; text-shadow: 0 1px 0 var(--boton-sombra);
    background: radial-gradient(circle at 35% 30%, var(--boton-luz), var(--boton) 55%, var(--boton-sombra));
    box-shadow: 0 7px 0 var(--boton-sombra), 0 9px 6px #000a;
    transition: transform 60ms, box-shadow 60ms;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .flechas button:active, .flechas button.pulsado {
    transform: translateY(6px); box-shadow: 0 1px 0 var(--boton-sombra), 0 2px 3px #000a;
  }
  .flechas .centro {
    grid-column: 2; grid-row: 2; width: 34px; height: 34px; margin: auto; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #444, #111); box-shadow: inset 0 2px 4px #000;
  }
  #arriba { grid-column: 2; grid-row: 1; }
  #izquierda { grid-column: 1; grid-row: 2; }
  #derecha { grid-column: 3; grid-row: 2; }
  #abajo { grid-column: 2; grid-row: 3; }
  @media (prefers-reduced-motion: reduce) { .flechas button, .grande { transition: none; } }
</style>

<div class="maquina">

      <button type="button" id="pausa" disabled>⏸ Pausa</button>
      <div class="derecha">
        <button type="button" id="completa" aria-label="Pantalla completa">⛶</button>
        <button type="button" id="sonido" aria-pressed="false">🔊 Sonido</button>
      </div>
    </div>

    <div class="pantalla">
      <div id="juego"></div>
      <p class="aviso" id="aviso" hidden></p>

      <!-- Pantalla 1: Menú de inicio -->
      <div class="cartel" id="menu">
        <h1>SNAKE RUSH</h1>
        <div class="grupo">
          <p class="etiqueta">Personaje</p>
          <div class="fila" id="cabezas"></div>
        </div>
        <div class="grupo">
          <p class="etiqueta">Color del cuerpo</p>
          <div class="fila" id="colores"></div>
        </div>
        <div class="grupo">
          <p class="etiqueta">Dificultad</p>
          <div class="fila" id="dificultades"></div>
        </div>
        <button type="button" class="grande" id="jugar">JUGAR</button>
        <div class="grupo">
          <p class="etiqueta">5 mejores</p>
          <ol class="tabla" id="tabla-menu"></ol>
        </div>
        <p class="nota" id="info-personaje"></p>
        <p class="nota">Cada mundo tiene 3 niveles: subes a los 10 y 20 puntos. Desliza el dedo sobre el tablero o usa los botones.</p>
      </div>

      <!-- Pantalla 2: Pausa -->
      <div class="cartel" id="pausado" hidden>
        <h2>PAUSA</h2>
        <button type="button" class="grande" id="seguir">SEGUIR</button>
        <button type="button" id="salir">Volver al menú</button>
      </div>

      <!-- Pantalla 3: Game Over -->
      <div class="cartel" id="fin" hidden>
        <h2>GAME OVER</h2>
        <p id="resumen"></p>
        <form class="grupo" id="form-record" hidden>
          <p class="etiqueta">¡Entraste a los 5 mejores! Tus iniciales:</p>
          <div class="fila">
            <input id="iniciales" maxlength="3" autocomplete="off" aria-label="Iniciales" placeholder="AAA">
            <button type="submit">Guardar</button>
          </div>
        </form>
        <div class="grupo">
          <p class="etiqueta">5 mejores</p>
          <ol class="tabla" id="tabla-fin"></ol>
        </div>
        <div class="fila">
          <button type="button" class="grande" id="otra-vez">OTRA VEZ</button>
          <button type="button" id="al-menu">Menú</button>
        </div>
      </div>
    </div>
  </div>

  <div class="flechas">
    <button type="button" id="arriba" aria-label="Arriba">▲</button>
    <button type="button" id="izquierda" aria-label="Izquierda">◀</button>
    <span class="centro" aria-hidden="true"></span>
    <button type="button" id="derecha" aria-label="Derecha">▶</button>
    <button type="button" id="abajo" aria-label="Abajo">▼</button>
  </div>
</div>

    if (nivel === 1) {

        muros.push({ x: 3 + i, y: 3 }, { x: 3, y: 3 + i });
        muros.push({ x: 16 - i, y: 3 }, { x: 16, y: 3 + i });
        muros.push({ x: 3 + i, y: 16 }, { x: 3, y: 16 - i });
        muros.push({ x: 16 - i, y: 16 }, { x: 16, y: 16 - i });
      }
    } else if (nivel >= 2) {
      // Pasillos: dos barras con un hueco en el medio
      for (let x = 3; x <= 16; x++) {
        if (x === 9 || x === 10) continue;
        muros.push({ x, y: 6 }, { x, y: 14 });
      }
    }
    // quitar repetidos
    return muros.filter((m, i) => muros.findIndex((o) => o.x === m.x && o.y === m.y) === i);
  }
  const VELOCIDAD_NIVEL = [1, 0.85, 0.72];

  // =====================================================================
  // 2. ESTADO DEL JUEGO (todo lo que "existe" en este momento)
  // =====================================================================
  const eleccion = { color: 'Verde', personaje: 'Clásica', dificultad: 'Normal' };

  // modo: 'menu' | 'jugando' | 'pausa' | 'fin'
  let modo = 'menu';
  let serpiente = [];
  let direccion = { x: 1, y: 0 };
  let siguiente = { x: 1, y: 0 }; // giro pedido; se aplica en el próximo paso
  let comida = { x: 0, y: 0 };
  let muros = [];
  let poder = null;     // { x, y, tipo, hasta } o null
  let efectos = {};     // poderes activos: { estrella: hastaMs, ... }
  let puntos = 0;
  let nivel = 0;        // 0, 1, 2 (se muestra como 1, 2, 3)
  let ultimoPaso = 0;
  let esperaHasta = 0;  // pausa corta al cambiar de nivel
  let explotada = false;

  const DIRECCIONES = {
    arriba: { x: 0, y: -1 },
    abajo: { x: 0, y: 1 },
    izquierda: { x: -1, y: 0 },
    derecha: { x: 1, y: 0 },
  };

  const mundo = () => PERSONAJES[eleccion.personaje];
  const activo = (efecto, ahora) => (efectos[efecto] || 0) > ahora;

  // ---------- Ayudantes de casillas ----------
  const misma = (a, b) => a.x === b.x && a.y === b.y;
  const esMuro = (c) => muros.some((m) => misma(m, c));
  const ocupada = (c) =>
    serpiente.some((p) => misma(p, c)) || esMuro(c) || misma(comida, c) || (poder && misma(poder, c));

  function casillaLibre(distanciaMinima = 0) {
    const cabeza = serpiente[0];
    for (let intento = 0; intento < 500; intento++) {
      const c = { x: Math.floor(Math.random() * COLUMNAS), y: Math.floor(Math.random() * FILAS) };
      const distancia = Math.abs(c.x - cabeza.x) + Math.abs(c.y - cabeza.y);
      if (!ocupada(c) && distancia >= distanciaMinima) return c;
    }
    return null;
  }

  // =====================================================================
  // 3. REGLAS DEL JUEGO
  // =====================================================================
  function ponerNivel(n) {
    nivel = n;
    serpiente = [{ x: 4, y: 10 }, { x: 3, y: 10 }, { x: 2, y: 10 }];
    direccion = { x: 1, y: 0 };
    siguiente = { x: 1, y: 0 };
    muros = mapaNivel(n);
    poder = null;
    comida = { x: -1, y: -1 };
    comida = casillaLibre(3);
  }

  function empezar() {
    efectos = {};
    puntos = 0;
    explotada = false;
    ponerNivel(0);
    cambiarModo('jugando');
    Sonido.musica(true);
    const escena = juego.scene.getScene('GameScene');
    esperaHasta = escena.time.now + 1000; // un segundo para prepararse
    escena.anunciar(`NIVEL 1\n${mundo().niveles[0]}`);
  }

  function girar(nombre) {
    if (modo !== 'jugando') return;
    const d = DIRECCIONES[nombre];
    if (d.x === -direccion.x && d.y === -direccion.y) return;
    siguiente = d;
  }

  // Un paso del juego: la serpiente avanza una casilla
  function paso(ahora, escena) {
    direccion = siguiente;
    const cabeza = serpiente[0];
    const nueva = { x: cabeza.x + direccion.x, y: cabeza.y + direccion.y };
    const invencible = activo('estrella', ahora);

    const chocaPared = nueva.x < 0 || nueva.x >= COLUMNAS || nueva.y < 0 || nueva.y >= FILAS;
    const vaAComer = misma(nueva, comida);
    const cuerpo = vaAComer ? serpiente : serpiente.slice(0, -1);
    const seMuerde = !invencible && cuerpo.some((p) => misma(p, nueva));

    const muroIndice = muros.findIndex((m) => misma(m, nueva));
    if (muroIndice >= 0 && invencible) {
      muros.splice(muroIndice, 1);
      Sonido.romper();
      escena.chispas(nueva, 0xbbbbbb);
    }
    const chocaMuro = muroIndice >= 0 && !invencible;

    if (chocaPared || seMuerde || chocaMuro) {
      perder(escena);
      return;
    }

    serpiente.unshift(nueva);

    if (vaAComer) {
      const gana = activo('doble', ahora) ? 2 : 1;
      puntos += gana;
      Sonido.comer();
      const colorComida = Object.values(mundo().comida.paleta)[0];
      escena.chispas(comida, colorComida);
      escena.textoFlotante(comida, `+${gana}`);

      // ¿Subió de nivel?
      const nivelNuevo = Math.min(2, Math.floor(puntos / PUNTOS_POR_NIVEL));
      if (nivelNuevo > nivel) {
        ponerNivel(nivelNuevo);
        esperaHasta = ahora + 1200;
        Sonido.nivel();
        escena.anunciar(`¡NIVEL ${nivelNuevo + 1}!\n${mundo().niveles[nivelNuevo]}`);
        return;
      }

      // Cada 3 puntos aparece un muro nuevo (lejos de tu cabeza)
      if (puntos % 3 === 0) {
        const m = casillaLibre(4);
        if (m) muros.push(m);
      }
      // Cada 5 puntos aparece un poder, si no hay otro
      if (puntos % 5 === 0 && !poder) {
        const opciones = mundo().poderes;
        const c = casillaLibre(3);
        if (c) poder = { ...c, tipo: opciones[Math.floor(Math.random() * opciones.length)], hasta: ahora + 10000 };
      }
      comida = casillaLibre(0) || comida;
    } else {
      serpiente.pop();
    }

    // ¿Agarró un poder?
    if (poder && misma(nueva, poder)) {
      const info = PODERES[poder.tipo];
      if (poder.tipo === 'rayo') {
        muros = muros.filter((m) => Math.abs(m.x - nueva.x) + Math.abs(m.y - nueva.y) > 5);
        escena.cameras.main.flash(250, 255, 240, 120);
        escena.cameras.main.shake(200, 0.01);
      } else {
        efectos[poder.tipo] = ahora + info.duracion;
      }
      escena.textoFlotante(poder, `${info.icono} ${info.nombre}`);
      Sonido.poder();
      poder = null;
    }
    if (poder && ahora > poder.hasta) poder = null;

    // Imán: la comida se acerca una casilla hacia tu cabeza
    if (activo('iman', ahora)) {
      const h = serpiente[0];
      const dx = Math.sign(h.x - comida.x);
      const dy = Math.sign(h.y - comida.y);
      const pasoX = { x: comida.x + dx, y: comida.y };
      const pasoY = { x: comida.x, y: comida.y + dy };
      const libre = (c) => !serpiente.some((p) => misma(p, c)) && !esMuro(c) && !(poder && misma(poder, c));
      const dist = Math.abs(h.x - comida.x) + Math.abs(h.y - comida.y);
      if (dist > 1) {
        if (dx !== 0 && libre(pasoX)) comida = pasoX;
        else if (dy !== 0 && libre(pasoY)) comida = pasoY;
      }
    }
  }

  function perder(escena) {
    escena.cameras.main.shake(300, 0.015);
    escena.explotar();
    explotada = true;
    Sonido.musica(false);
    Sonido.perder();
    modo = 'fin';
    $('pausa').disabled = true;
    // Mostramos el cartel después de ver la explosión
    setTimeout(() => {
      if (modo !== 'fin') return;
      cambiarModo('fin');
      mostrarFin();
    }, 900);
  }

  // =====================================================================
  // 4. DIBUJO (Phaser)
  // =====================================================================
  function pintarDibujo(g, diseño, cx, cy) {
    diseño.dibujo.forEach((fila, y) => {
      [...fila].forEach((letra, x) => {
        if (letra === '.') return;
        g.fillStyle(diseño.paleta[letra]);
        g.fillRect(cx * CASILLA + x * 2, cy * CASILLA + y * 2, 2, 2);
      });
    });
  }

  function cuadros(g, a, b) {
    for (let x = 0; x < COLUMNAS; x++) {
      for (let y = 0; y < FILAS; y++) {
        g.fillStyle((x + y) % 2 === 0 ? a : b);
        g.fillRect(x * CASILLA, y * CASILLA, CASILLA, CASILLA);
      }
    }
  }

  function pintarFondo(g) {
    const ancho = COLUMNAS * CASILLA;
    const alto = FILAS * CASILLA;
    switch (mundo().fondo) {
      case 'bosque':
        cuadros(g, 0x7cc34a, 0x6fb33f);
        break;
      case 'cielo':
        g.fillStyle(0x5c94fc);
        g.fillRect(0, 0, ancho, alto);
        g.fillStyle(0xffffff, 0.85);
        for (const [nx, ny] of [[60, 50], [250, 110], [130, 250], [320, 320]]) {
          g.fillRect(nx, ny, 50, 12);
          g.fillRect(nx + 10, ny - 8, 28, 10);
        }
        break;
      case 'subterraneo':
        g.fillStyle(0x10162f);
        g.fillRect(0, 0, ancho, alto);
        g.lineStyle(1, 0x22305e);
        for (let y = 0; y <= FILAS; y++) {
          g.lineBetween(0, y * CASILLA, ancho, y * CASILLA);
          for (let x = 0; x <= COLUMNAS; x++) {
            const corrido = y % 2 === 0 ? 0 : CASILLA / 2;
            g.lineBetween(x * CASILLA + corrido, y * CASILLA, x * CASILLA + corrido, (y + 1) * CASILLA);
          }
        }
        break;
      case 'dulce':
        cuadros(g, 0xffe3ef, 0xffd3e6);
        break;
      case 'greenhill':
        cuadros(g, 0xd28a3a, 0xb5702a);
        break;
      default: // arcade
        g.fillStyle(0x000000);
        g.fillRect(0, 0, ancho, alto);
        g.lineStyle(1, 0x1c2a22);
        for (let i = 0; i <= COLUMNAS; i++) g.lineBetween(i * CASILLA, 0, i * CASILLA, alto);
        for (let j = 0; j <= FILAS; j++) g.lineBetween(0, j * CASILLA, ancho, j * CASILLA);
    }
  }

  // Color del pedazo i del cuerpo (arcoíris con la estrella)
  function colorCuerpo(i, ahora) {
    if (activo('estrella', ahora)) {
      return Phaser.Display.Color.HSVToRGB(((ahora / 600) + i * 0.08) % 1, 0.8, 1).color;
    }
    const base = Phaser.Display.Color.IntegerToColor(COLORES[eleccion.color]);
    return i % 2 === 0 ? base.color : base.clone().darken(12).color;
  }

  class GameScene extends Phaser.Scene {
    constructor() {
      super('GameScene');
    }

    create() {
      this.lapiz = this.add.graphics();
      this.hud = this.add.text(6, 4, '', {
        fontFamily: 'Courier New, monospace',
        fontSize: '14px',
        color: '#ffffff',
        backgroundColor: '#000000aa',
        padding: { x: 4, y: 2 },
      }).setDepth(10);
      this.cartel = this.add.text(200, 200, '', {
        fontFamily: 'Courier New, monospace',
        fontSize: '26px',
        fontStyle: 'bold',
        color: '#ffd83a',
        align: 'center',
        stroke: '#000000',
        strokeThickness: 6,
      }).setOrigin(0.5).setDepth(20).setAlpha(0);
      // Serpiente de muestra para el menú
      serpiente = [{ x: 11, y: 14 }, { x: 10, y: 14 }, { x: 9, y: 14 }, { x: 8, y: 14 }, { x: 7, y: 14 }];
      comida = { x: 14, y: 14 };
    }

    // update() corre ~60 veces por segundo: es el "game loop"
    update(ahora) {
      let espera = DIFICULTADES[eleccion.dificultad] * VELOCIDAD_NIVEL[nivel];
      if (activo('reloj', ahora)) espera *= 1.8;
      if (modo === 'jugando' && ahora > esperaHasta && ahora - ultimoPaso >= espera) {
        ultimoPaso = ahora;
        paso(ahora, this);
      }
      this.dibujar(ahora);
    }

    // ---------- Animaciones ----------
    chispas(casilla, color) {
      const cx = casilla.x * CASILLA + CASILLA / 2;
      const cy = casilla.y * CASILLA + CASILLA / 2;
      for (let i = 0; i < 12; i++) {
        const angulo = (Math.PI * 2 * i) / 12;
        const chispa = this.add.rectangle(cx, cy, 4, 4, i % 2 ? color : 0xffffff).setDepth(5);
        this.tweens.add({
          targets: chispa,
          x: cx + Math.cos(angulo) * 26,
          y: cy + Math.sin(angulo) * 26,
          alpha: 0,
          duration: 380,
          ease: 'Cubic.easeOut',
          onComplete: () => chispa.destroy(),
        });
      }
    }

    textoFlotante(casilla, texto) {
      const t = this.add.text(casilla.x * CASILLA + CASILLA / 2, casilla.y * CASILLA, texto, {
        fontFamily: 'Courier New, monospace',
        fontSize: '15px',
        fontStyle: 'bold',
        color: '#ffffff',
        stroke: '#000000',
        strokeThickness: 4,
      }).setOrigin(0.5).setDepth(15);
      this.tweens.add({
        targets: t,
        y: t.y - 30,
        alpha: 0,
        duration: 800,
        ease: 'Sine.easeOut',
        onComplete: () => t.destroy(),
      });
    }

    anunciar(texto) {
      this.cartel.setText(texto).setAlpha(1).setScale(0.6);
      this.tweens.killTweensOf(this.cartel);
      this.tweens.add({ targets: this.cartel, scale: 1, duration: 300, ease: 'Back.easeOut' });
      this.tweens.add({ targets: this.cartel, alpha: 0, delay: 1300, duration: 400 });
    }

    explotar() {
      serpiente.forEach((p, i) => {
        const pedazo = this.add.rectangle(
          p.x * CASILLA + CASILLA / 2, p.y * CASILLA + CASILLA / 2,
          CASILLA - 4, CASILLA - 4, i === 0 ? 0xffffff : colorCuerpo(i, 0),
        ).setDepth(6);
        const angulo = Math.random() * Math.PI * 2;
        const distancia = 40 + Math.random() * 80;
        this.tweens.add({
          targets: pedazo,
          x: pedazo.x + Math.cos(angulo) * distancia,
          y: pedazo.y + Math.sin(angulo) * distancia,
          angle: Phaser.Math.Between(-360, 360),
          alpha: 0,
          scale: 0.3,
          duration: 800,
          ease: 'Cubic.easeOut',
          onComplete: () => pedazo.destroy(),
        });
      });
    }

    // ---------- Dibujar todo ----------
    dibujar(ahora) {
      const g = this.lapiz;
      g.clear();
      pintarFondo(g);

      const m = mundo();
      for (const muro of muros) pintarDibujo(g, m.muro, muro.x, muro.y);
      pintarDibujo(g, m.comida, comida.x, comida.y);

      if (poder && (poder.hasta - ahora > 3000 || Math.floor(ahora / 150) % 2 === 0)) {
        pintarDibujo(g, PODERES[poder.tipo], poder.x, poder.y);
      }

      if (!explotada) this.dibujarSerpiente(g, ahora);

      // HUD: puntos, nivel, récord y poderes activos
      let texto = `Puntos ${puntos} · Nivel ${nivel + 1} · Récord ${Math.max(record(), puntos)}`;
      for (const [tipo, hasta] of Object.entries(efectos)) {
        if (hasta > ahora) texto += `  ${PODERES[tipo].icono} ${Math.ceil((hasta - ahora) / 1000)}s`;
      }
      this.hud.setText(texto);
      this.hud.setVisible(modo !== 'menu');
    }

    dibujarSerpiente(g, ahora) {
      // 1. Uniones entre pedazos, para que el cuerpo se vea continuo
      for (let i = 1; i < serpiente.length; i++) {
        const a = serpiente[i - 1];
        const b = serpiente[i];
        g.fillStyle(colorCuerpo(i, ahora));
        const x = Math.min(a.x, b.x) * CASILLA + 3;
        const y = Math.min(a.y, b.y) * CASILLA + 3;
        const ancho = (Math.abs(a.x - b.x) + 1) * CASILLA - 6;
        const alto = (Math.abs(a.y - b.y) + 1) * CASILLA - 6;
        g.fillRect(x, y, ancho, alto);
      }
      // 2. Pedazos redondeados con brillo; la cola es más chica
      for (let i = serpiente.length - 1; i >= 1; i--) {
        const p = serpiente[i];
        const esCola = i === serpiente.length - 1;
        const borde = esCola ? 4 : 1;
        const color = colorCuerpo(i, ahora);
        g.fillStyle(color);
        g.fillRoundedRect(p.x * CASILLA + borde, p.y * CASILLA + borde, CASILLA - borde * 2, CASILLA - borde * 2, 6);
        g.fillStyle(0xffffff, 0.25);
        g.fillRoundedRect(p.x * CASILLA + borde + 3, p.y * CASILLA + borde + 3, 6, 4, 2);
      }

      // 3. La cabeza
      const cabeza = serpiente[0];
      const diseño = mundo().cabeza;
      const invencible = activo('estrella', ahora);
      if (diseño === null) {
        const px = cabeza.x * CASILLA;
        const py = cabeza.y * CASILLA;
        g.fillStyle(invencible ? 0xffd700 : COLORES[eleccion.color]);
        g.fillRoundedRect(px, py, CASILLA, CASILLA, 7);
        g.fillStyle(0xffffff);
        const ojos = direccion.x !== 0
          ? [[px + 8 + direccion.x * 3, py + 3], [px + 8 + direccion.x * 3, py + 11]]
          : [[px + 3, py + 8 + direccion.y * 3], [px + 11, py + 8 + direccion.y * 3]];
        for (const [ox, oy] of ojos) {
          g.fillStyle(0xffffff);
          g.fillRect(ox, oy, 6, 6);
          g.fillStyle(0x111111);
          g.fillRect(ox + 1 + direccion.x * 2 + 1, oy + 1 + direccion.y * 2 + 1, 3, 3);
        }
      } else {
        if (invencible) {
          g.fillStyle(0xffd700, 0.5);
          g.fillRect(cabeza.x * CASILLA - 2, cabeza.y * CASILLA - 2, CASILLA + 4, CASILLA + 4);
        }
        pintarDibujo(g, diseño, cabeza.x, cabeza.y);
      }
    }
  }

  const juego = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'juego',
    width: COLUMNAS * CASILLA,
    height: FILAS * CASILLA,
    backgroundColor: '#000000',
    pixelArt: true,
    scene: GameScene,
  });

  // =====================================================================
  // 5. SONIDO: generado con la Web Audio API (sin archivos)
  // =====================================================================
  const Sonido = (() => {
    let ctx = null;
    let silencio = false;
    let musicaTimer = null;

    function iniciar() {
      try {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
      } catch (e) { ctx = null; }
    }

    function tono(freq, dur, tipo = 'square', vol = 0.12, retraso = 0, freqFinal = null) {
      if (silencio || !ctx) return;
      const t = ctx.currentTime + retraso;
      const osc = ctx.createOscillator();
      const gan = ctx.createGain();
      osc.type = tipo;
      osc.frequency.setValueAtTime(freq, t);
      if (freqFinal) osc.frequency.exponentialRampToValueAtTime(freqFinal, t + dur);
      gan.gain.setValueAtTime(vol, t);
      gan.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gan).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }

    const MELODIA = [523, 0, 659, 0, 784, 659, 523, 0, 587, 0, 698, 0, 880, 698, 587, 0,
                     523, 0, 659, 0, 784, 880, 988, 0, 1047, 0, 784, 0, 523, 0, 0, 0];
    let nota = 0;

    return {
      iniciar,
      comer: () => { tono(660, 0.07); tono(990, 0.09, 'square', 0.12, 0.07); },
      perder: () => { tono(440, 0.6, 'sawtooth', 0.15, 0, 60); },
      poder: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tono(f, 0.1, 'square', 0.1, i * 0.07)),
      nivel: () => [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => tono(f, 0.14, 'square', 0.1, i * 0.1)),
      romper: () => tono(180, 0.12, 'square', 0.12, 0, 60),
      musica(encender) {
        clearInterval(musicaTimer);
        musicaTimer = null;
        if (!encender) return;
        musicaTimer = setInterval(() => {
          const f = MELODIA[nota % MELODIA.length];
          if (f) tono(f / 2, 0.16, 'triangle', 0.06);
          nota++;
        }, 170);
      },
      alternar() {
        silencio = !silencio;
        return silencio;
      },
    };
  })();

  // =====================================================================
  // 6. RÉCORDS: guardados en este aparato (localStorage)
  // =====================================================================
  function leerTop() {
    try {
      const datos = JSON.parse(localStorage.getItem('snake-top5') || '[]');
      return Array.isArray(datos) ? datos : [];
    } catch (e) { return []; }
  }
  function guardarTop(lista) {
    try { localStorage.setItem('snake-top5', JSON.stringify(lista)); } catch (e) { /* sin guardado */ }
  }
  const record = () => (leerTop()[0] ? leerTop()[0].puntos : 0);
  const entraAlTop = (p) => p > 0 && (leerTop().length < 5 || p > leerTop()[4].puntos);

  function pintarTabla(id) {
    const ol = document.getElementById(id);
    ol.replaceChildren();
    const lista = leerTop();
    if (lista.length === 0) {
      const li = document.createElement('li');
      li.className = 'vacia';
      li.textContent = 'Aún no hay récords';
      ol.appendChild(li);
      return;
    }
    lista.forEach((r, i) => {
      const li = document.createElement('li');
      const nombre = document.createElement('span');
      nombre.textContent = `${i + 1}. ${r.iniciales} (${r.cabeza})`;
      const pts = document.createElement('span');
      pts.textContent = r.puntos;
      li.append(nombre, pts);
      ol.appendChild(li);
    });
  }

  // =====================================================================
  // 7. PANTALLAS Y BOTONES (HTML)
  // =====================================================================
  const $ = (id) => document.getElementById(id);

  function cambiarModo(nuevo) {
    modo = nuevo;
    $('menu').hidden = modo !== 'menu';
    $('pausado').hidden = modo !== 'pausa';
    $('fin').hidden = modo !== 'fin';
    $('pausa').disabled = modo !== 'jugando';
    if (modo === 'menu') {
      pintarTabla('tabla-menu');
      explotada = false;
    }
  }

  function mostrarFin() {
    const esRecord = puntos > 0 && puntos > record();
    $('resumen').textContent = (esRecord ? `¡NUEVO RÉCORD! ${puntos} puntos` : `Hiciste ${puntos} puntos`) +
      ` · llegaste al nivel ${nivel + 1}`;
    $('form-record').hidden = !entraAlTop(puntos);
    $('iniciales').value = '';
    pintarTabla('tabla-fin');
  }

  let avisoTimer = null;
  function avisar(texto) {
    $('aviso').textContent = texto;
    $('aviso').hidden = false;
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(() => { $('aviso').hidden = true; }, 4500);
  }

  $('form-record').addEventListener('submit', (e) => {
    e.preventDefault();
    const iniciales = ($('iniciales').value.trim().toUpperCase() || '???').slice(0, 3);
    const lista = leerTop();
    lista.push({ iniciales, puntos, cabeza: eleccion.personaje });
    lista.sort((a, b) => b.puntos - a.puntos);
    guardarTop(lista.slice(0, 5));
    $('form-record').hidden = true;
    pintarTabla('tabla-fin');
  });

  function jugar() {
    Sonido.iniciar(); // el navegador solo deja sonar audio después de un toque
    empezar();
  }
  $('jugar').addEventListener('click', jugar);
  $('otra-vez').addEventListener('click', jugar);
  $('al-menu').addEventListener('click', () => cambiarModo('menu'));

  function pausar() {
    if (modo === 'jugando') {
      cambiarModo('pausa');
      Sonido.musica(false);
    } else if (modo === 'pausa') {
      cambiarModo('jugando');
      Sonido.musica(true);
    }
  }
  $('pausa').addEventListener('click', pausar);
  $('seguir').addEventListener('click', pausar);
  $('salir').addEventListener('click', () => cambiarModo('menu'));

  $('sonido').addEventListener('click', () => {
    Sonido.iniciar();
    const callado = Sonido.alternar();
    $('sonido').textContent = callado ? '🔇 Silencio' : '🔊 Sonido';
    $('sonido').setAttribute('aria-pressed', String(callado));
  });

  // Pantalla completa (si el navegador lo permite)
  $('completa').addEventListener('click', async () => {
    const el = document.documentElement;
    const pedir = el.requestFullscreen || el.webkitRequestFullscreen;
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else if (pedir) {
        await pedir.call(el);
      } else {
        throw new Error('sin soporte');
      }
    } catch (e) {
      avisar('En iPad: toca Compartir y luego "Agregar a pantalla de inicio" para jugar en pantalla completa.');
    }
  });

  // Botones de opción (personaje, color, dificultad)
  function crearOpciones(contenedorId, opciones, clave, alCrear) {
    const contenedor = $(contenedorId);
    for (const nombre of Object.keys(opciones)) {
      const boton = document.createElement('button');
      boton.type = 'button';
      boton.id = `${clave}-${nombre}`;
      boton.setAttribute('aria-pressed', String(eleccion[clave] === nombre));
      alCrear(boton, nombre);
      boton.addEventListener('click', () => {
        eleccion[clave] = nombre;
        contenedor.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === boton)));
        if (clave === 'personaje') mostrarInfoPersonaje();
      });
      contenedor.appendChild(boton);
    }
  }
  function mostrarInfoPersonaje() {
    const iconos = mundo().poderes.map((p) => `${PODERES[p].icono} ${PODERES[p].nombre}`).join(' · ');
    $('info-personaje').textContent = `Poderes: ${iconos}`;
  }
  crearOpciones('cabezas', PERSONAJES, 'personaje', (b, n) => { b.textContent = n; });
  crearOpciones('colores', COLORES, 'color', (b, n) => {
    b.className = 'color';
    b.style.background = '#' + COLORES[n].toString(16).padStart(6, '0');
    b.setAttribute('aria-label', n);
    b.title = n;
  });
  crearOpciones('dificultades', DIFICULTADES, 'dificultad', (b, n) => { b.textContent = n; });
  mostrarInfoPersonaje();

  // Flechas en pantalla
  for (const nombre of Object.keys(DIRECCIONES)) {
    $(nombre).addEventListener('pointerdown', (e) => {
      e.preventDefault();
      girar(nombre);
    });
  }

  // Deslizar el dedo sobre el tablero
  let inicioToque = null;
  const pantalla = document.querySelector('.pantalla');
  pantalla.addEventListener('pointerdown', (e) => {
    if (modo === 'jugando') inicioToque = { x: e.clientX, y: e.clientY };
  });
  pantalla.addEventListener('pointermove', (e) => {
    if (!inicioToque) return;
    const dx = e.clientX - inicioToque.x;
    const dy = e.clientY - inicioToque.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; // muy corto todavía
    if (Math.abs(dx) > Math.abs(dy)) girar(dx > 0 ? 'derecha' : 'izquierda');
    else girar(dy > 0 ? 'abajo' : 'arriba');
    inicioToque = { x: e.clientX, y: e.clientY }; // permite encadenar giros sin levantar el dedo
  });
  const soltar = () => { inicioToque = null; };
  pantalla.addEventListener('pointerup', soltar);
  pantalla.addEventListener('pointercancel', soltar);

  // Teclado
  const TECLAS = { ArrowUp: 'arriba', ArrowDown: 'abajo', ArrowLeft: 'izquierda', ArrowRight: 'derecha' };
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (TECLAS[e.key]) {
      e.preventDefault();
      girar(TECLAS[e.key]);
      const b = $(TECLAS[e.key]);
      b.classList.add('pulsado');
      setTimeout(() => b.classList.remove('pulsado'), 120);
    } else if (e.key === ' ' || e.key === 'p') {
      e.preventDefault();
      pausar();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && modo === 'jugando') pausar();
  });

  cambiarModo('menu');
</script>
</body></html>
